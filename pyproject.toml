[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A local, always-listening voice assistant for Fedora Linux with a Gemini brain"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17,<2",
    # openwakeword itself is installed with --no-deps in the setup script.
    # Its PyPI metadata still requires tflite-runtime on Linux, which has no
    # 3.12 wheel. We use the ONNX backend (already here via onnxruntime) and
    # install these real runtime deps ourselves.
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "requests>=2.28,<3",
    # Pin exact versions. A range like faster-whisper>=1.1,<2 makes pip
    # backtrack through every older release looking for tokenizers, and on a
    # slow connection that shows up as "no matching distribution: tokenizers"
    # even though the wheel exists.
    "tokenizers>=0.21,<1",
    "ctranslate2>=4.0,<5",
    "av>=11",
    "huggingface-hub>=0.21",
    "faster-whisper==1.2.1",
    "google-genai>=1.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
